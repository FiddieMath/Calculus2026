name: Query code mail bot

on:
  schedule:
    # GitHub 的定时触发在这个仓库里不可靠（实测经常几小时才触发一次），
    # 所以这里只用它做兜底；真正的连续检查由运行内的 55 分钟长轮询
    # 以及“结束时自触发下一次”完成。
    - cron: "*/30 * * * *"
  push:
    paths:
      - ".github/workflows/query-code-mailer.yml"
      - "scripts/mail_query_bot.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只演练：只检查邮件，不发送、不标记已读"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: query-code-mail-bot
  # 不取消正在运行的长轮询；新运行排队，等当前运行结束后立即接上
  cancel-in-progress: false

jobs:
  mail-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configuration
        id: cfg
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          QUERY_KEYS_CSV: ${{ secrets.QUERY_KEYS_CSV }}
          QUERY_KEYS_B64: ${{ secrets.QUERY_KEYS_B64 }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_AUTH_CODE" ] || { [ -z "$QUERY_KEYS_CSV" ] && [ -z "$QUERY_KEYS_B64" ]; }; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚未配置邮箱 Secret（MAIL_USER / MAIL_AUTH_CODE / QUERY_KEYS_B64），本次跳过。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deadline
        id: deadline
        env:
          END_DATE: ${{ vars.MAIL_BOT_END_DATE || '2027-01-15' }}
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          echo "今天：$today，截止日期：$END_DATE"
          if [[ "$today" > "$END_DATE" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "::notice::已过邮件机器人截止日期 $END_DATE，机器人停止工作。"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mail bot
        if: steps.cfg.outputs.configured == 'true' && steps.deadline.outputs.expired != 'true'
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          QUERY_KEYS_CSV: ${{ secrets.QUERY_KEYS_CSV }}
          QUERY_KEYS_B64: ${{ secrets.QUERY_KEYS_B64 }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          MAIL_ALLOWED_DOMAIN: ${{ vars.MAIL_ALLOWED_DOMAIN }}
          MAIL_COURSE_NAME: ${{ vars.MAIL_COURSE_NAME }}
          MAIL_SITE_URL: ${{ vars.MAIL_SITE_URL }}
          MAIL_SUBJECT_KEYWORD: ${{ vars.MAIL_SUBJECT_KEYWORD || '查询码' }}
          MAIL_BOT_END_DATE: ${{ vars.MAIL_BOT_END_DATE || '2027-01-15' }}
          MAIL_BOT_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/mail_query_bot.py --watch-minutes 55 --interval-seconds 60

      - name: Trigger next run
        if: always() && steps.cfg.outputs.configured == 'true' && steps.deadline.outputs.expired != 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run query-code-mailer.yml --ref main --repo "${{ github.repository }}" || \
            echo "::warning::触发下一次运行失败，等待下一次定时兜底。"

      - name: Disable workflow after deadline
        if: steps.deadline.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable query-code-mailer.yml || \
            echo "::warning::自动停用失败，请在 Actions 页面手动停用 Query code mail bot。"
