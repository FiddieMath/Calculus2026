<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微积分 · 作业查分台</title>
  <meta name="description" content="微积分课程作业完成情况与资料查询" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <p id="demo-banner" class="demo-banner" hidden>
    演示模式：学号 <code>20260001</code> · 查询码 <code>20260001</code>
  </p>

  <header class="topbar">
    <h1 id="site-title">微积分 · 作业查分台</h1>
    <p class="topbar-sub" id="site-sub"></p>
  </header>

  <main class="page">
    <!-- 主页 -->
    <section id="view-home" class="view" data-view="home">
      <section class="login-band" aria-label="学生查询">
        <form id="login-form" class="login-form" novalidate>
          <label>
            <span>学号</span>
            <input id="login-sid" name="sid" type="text" inputmode="numeric" autocomplete="off"
                   placeholder="例如 20260001" required />
          </label>
          <label>
            <span>查询码</span>
            <input id="login-code" name="code" type="password" autocomplete="off"
                   placeholder="默认与学号相同" required />
          </label>
          <button class="btn" type="submit">查询</button>
        </form>
        <p class="login-note">输入学号与查询码后，将弹出你各次作业的完成情况。查询码默认为学号，私下改过请用新码。</p>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <p class="whoami" id="whoami" hidden></p>
      </section>

      <section class="panel" aria-labelledby="assign-head">
        <div class="panel-head">
          <h2 id="assign-head">作业安排</h2>
          <span class="muted">点击作业名称查看题目与参考答案</span>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr><th>作业次数</th><th>截止时间</th><th>作业内容</th></tr>
            </thead>
            <tbody id="assign-rows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="material-head">
        <div class="panel-head">
          <h2 id="material-head">附加资料</h2>
          <span class="muted">期中考试讲解、知识点梳理等将陆续添加</span>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr><th>资料名称</th><th>状态</th></tr>
            </thead>
            <tbody id="material-rows"></tbody>
          </table>
        </div>
      </section>
    </section>

    <!-- 作业详情 -->
    <section id="view-assignment" class="view" data-view="work" hidden>
      <p><a class="back" href="#/home">← 返回作业安排</a></p>
      <h2 id="work-title"></h2>
      <p class="muted" id="work-due"></p>
      <section class="paper" id="work-content" aria-label="作业题目"></section>
      <section class="paper" id="work-answer" aria-label="参考答案"></section>
    </section>

    <!-- 附加资料详情 -->
    <section id="view-material" class="view" data-view="material" hidden>
      <p><a class="back" href="#/home">← 返回主页</a></p>
      <h2 id="mat-title"></h2>
      <article class="paper" id="mat-content"></article>
    </section>
  </main>

  <footer class="footer">
    <p id="footer-contact"></p>
  </footer>

  <!-- 完成情况弹窗 -->
  <div class="modal-mask" id="status-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="status-modal-title">
      <div class="modal-head">
        <h2 id="status-modal-title">完成情况</h2>
        <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <p class="modal-note" id="modal-note"></p>
      <div class="table-wrap">
        <table class="tbl">
          <thead>
            <tr><th>作业次数</th><th>截止时间</th><th>完成状态</th><th>成绩</th><th>批注</th></tr>
          </thead>
          <tbody id="status-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/js/crypto-core.js"></script>
  <script src="assets/vendor/marked/marked.min.js"></script>
  <script src="assets/vendor/katex/katex.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
